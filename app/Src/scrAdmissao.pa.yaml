            - btnAdmGravar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  Height: =48
                  HoverFill: =RGBA(12, 90, 100, 1)
                  LayoutMinHeight: =48
                  OnSelect: |-
                    =If(IsBlank(txtAdmNome.Text) || IsBlank(txtAdmLeito.Text) || IsBlank(dtpAdmAdmissao.SelectedDate), Notify("Preencha nome, leito e data de admissão antes de gravar.", NotificationType.Warning), Set(gNovoPaciente, Patch(TxPaciente, Defaults(TxPaciente), {Title: txtAdmNome.Text, Prontuário: txtAdmPront.Text, 'Data de nascimento': dtpAdmNasc.SelectedDate, Leito: txtAdmLeito.Text, 'Data de admissão': dtpAdmAdmissao.SelectedDate, 'Data do transplante': dtpAdmTx.SelectedDate, 'Tipo de doador': ddAdmDoador.Selected, 'Peculiaridade imunológica ou infecciosa': txtAdmPecul.Text, Status: LookUp(Choices(TxPaciente.Status), Value = "Internado")})); Set(gNovoPlano, Patch(TxPlano, Defaults(TxPlano), {Title: txtAdmNome.Text & " · plano", PacienteRef: {Id: gNovoPaciente.ID, Value: gNovoPaciente.Title}, MotivoInternacao: txtAdmMotivo.Text, DesfechoPretendido: txtAdmDesfecho.Text, DataAlvoAltaOriginal: dtpAdmAlvo.SelectedDate, DataAlvoAltaAtual: dtpAdmAlvo.SelectedDate, DestinoPosAlta: ddAdmDestino.Selected, OrigemPlano: LookUp(Choices(TxPlano.'Origem do plano'), Value = "Admissão"), VersaoPlano: 1, DataUltimaRevisao: Now()})); Patch(TxPlanoVersao, Defaults(TxPlanoVersao), {Title: txtAdmNome.Text & " · v1", PlanoRef: {Id: gNovoPlano.ID, Value: gNovoPlano.Title}, PacienteRef: {Id: gNovoPaciente.ID, Value: gNovoPaciente.Title}, Versao: 1, DataAlvoAlta: dtpAdmAlvo.SelectedDate, DestinoPosAlta: ddAdmDestino.Selected, MotivoInternacao: txtAdmMotivo.Text, DesfechoPretendido: txtAdmDesfecho.Text, QuemRevisou: gMeuMembro, DataRevisao: Now()}); Set(gResetAdm, true); Set(gResetAdm, false); Notify("Paciente admitido e plano criado.", NotificationType.Success); Navigate(scrPainel))
                  Size: =14
                  Text: ="Admitir e criar o plano"

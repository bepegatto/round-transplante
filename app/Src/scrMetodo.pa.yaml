      - recMet6:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(240, 243, 246, 1)
            Height: =recMet1.Height
            Width: =recMet1.Width
            X: =recMet1.X
            Y: =recMet5.Y + recMet5.Height + 8
      - lblMet6Num:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(15, 109, 120, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            PaddingLeft: =0
            PaddingRight: =0
            Size: =22
            Text: ="6"
            Width: =40

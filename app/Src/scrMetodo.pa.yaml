      - recMet5:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(240, 243, 246, 1)
            Height: =recMet1.Height
            Width: =recMet1.Width
            X: =recMet1.X
            Y: =recMet4.Y + recMet4.Height + 8
      - lblMet5Num:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 0)

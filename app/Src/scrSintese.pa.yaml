Screens:
  scrSintese:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gPlano, LookUp(TxPlano, PacienteRef.Id = gPaciente.ID));
        Set(gRP, LookUp(TxRoundPaciente, RoundRef.Id = gRound.ID && PacienteRef.Id = gPaciente.ID));
        Set(gDesvioSugerido, Or(gPlano.DataAlvoAltaAtual < Today(), gPlano.DataAlvoAltaOriginal < Today()));
        Set(gAbaSintese, "Decisões");
        Set(gResetPend, true);
        Set(gResetPend, false);
        Set(gResetSint, true);
        Set(gResetSint, false);
        Set(gResetCrit, true);
        Set(gResetCrit, false)
    Children:
      - ctnSinCab:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =galSinAbas.Y + galSinAbas.Height
            Width: =Parent.Width
          Children:
            - lblSinVoltar:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =If(App.Width < 600, 40, 28)
                  OnSelect: =Navigate(scrPaciente)
                  PaddingLeft: =0
                  Text: ="< Voltar ao paciente"
                  Width: =If(App.Width < 600, 200, 240)
                  X: =24
                  Y: =If(App.Width < 600, 12, 20)
            - lblSinPos:
                Control: Label@2.5.1
                Properties:
                  Align: =If(App.Width < 600, Align.Right, Align.Center)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 110, 122, 1)
                  Font: =Font.'Segoe UI'
                  Height: =If(App.Width < 600, 40, 36)
                  Size: =If(App.Width < 600, 12, 11)
                  Text: ="Paciente " & gPosCoord & " de " & CountRows(colOrdem)
                  Visible: =gModoCoord && CountRows(colOrdem) > 0 && !locSug
                  Width: =If(App.Width < 600, 140, 120)
                  X: =If(App.Width < 600, Parent.Width - 164, Parent.Width - 360)
                  Y: =If(App.Width < 600, 12, 16)
            - btnSinAnterior:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(15, 109, 120, 1)
                  Color: =RGBA(15, 109, 120, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =If(App.Width < 600, 40, 36)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(15, 109, 120, 1)
                  OnSelect: |-
                    =Set(gRP, Patch(TxRoundPaciente, Coalesce(LookUp(TxRoundPaciente, RoundRef.Id = gRound.ID && PacienteRef.Id = gPaciente.ID), Defaults(TxRoundPaciente)), {Title: gPaciente.Title & " · " & Text(Today(), "dd/mm"), RoundRef: {Id: gRound.ID, Value: gRound.Title}, PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title}, 'Desvio sugerido': gDesvioSugerido, 'Em desvio': tglSinEmDesvio.Value, 'Causa do desvio': ddSinCausa.Selected, 'Meta até o próximo round': txtSinMeta.Text, 'Previsão de alta revisada': dtpSinPrevisao.SelectedDate, 'Hospital dia': tglSinHospitalDia.Value, 'Cuidados com feridas pós-alta': tglSinFeridas.Value, 'Texto para o prontuário': txtSinPEP.Text}));
                    If(!IsBlank(gPlano.ID) && (dtpSinPrevisao.SelectedDate <> gPlano.DataAlvoAltaAtual || ddSinDestino.Selected.Value <> gPlano.DestinoPosAlta.Value), Set(gPlano, Patch(TxPlano, gPlano, {DataAlvoAltaAtual: dtpSinPrevisao.SelectedDate, DestinoPosAlta: ddSinDestino.Selected, VersaoPlano: Coalesce(gPlano.VersaoPlano, 1) + 1, DataUltimaRevisao: Now()}));
                    Patch(TxPlanoVersao, Defaults(TxPlanoVersao), {Title: gPaciente.Title & " · v" & gPlano.VersaoPlano, PlanoRef: {Id: gPlano.ID, Value: gPlano.Title}, PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title}, RoundRef: {Id: gRound.ID, Value: gRound.Title}, Versao: gPlano.VersaoPlano, DataAlvoAlta: gPlano.DataAlvoAltaAtual, DestinoPosAlta: LookUp(Choices(TxPlanoVersao.DestinoPosAlta), Value = gPlano.DestinoPosAlta.Value), MotivoInternacao: gPlano.MotivoInternacao, DesfechoPretendido: gPlano.DesfechoPretendido, QuemRevisou: gMeuMembro, DataRevisao: Now()}));
                    Set(gPosCoord, gPosCoord - 1);
                    Set(gPaciente, Index(colOrdem, gPosCoord));
                    Set(gPlano, LookUp(TxPlano, PacienteRef.Id = gPaciente.ID));
                    Set(gRP, LookUp(TxRoundPaciente, RoundRef.Id = gRound.ID && PacienteRef.Id = gPaciente.ID));
                    Set(gDesvioSugerido, Or(gPlano.DataAlvoAltaAtual < Today(), gPlano.DataAlvoAltaOriginal < Today()));
                    Set(gAbaSintese, "Decisões");
                    Set(gResetPend, true);
                    Set(gResetPend, false);
                    Set(gResetSint, true);
                    Set(gResetSint, false);
                    Set(gResetCrit, true);
                    Set(gResetCrit, false);
                    Notify("Síntese gravada. Voltando para " & gPaciente.Title, NotificationType.Success)
                  Size: =If(App.Width < 600, 12, 11)
                  Text: ="‹ Anterior"
                  Tooltip: ="Grava a síntese e volta ao paciente anterior"
                  Visible: =gModoCoord && CountRows(colOrdem) > 0 && !locSug && gPosCoord > 1
                  Width: =If(App.Width < 600, 110, 120)
                  X: =If(App.Width < 600, 24, Parent.Width - 488)
                  Y: =If(App.Width < 600, 60, 16)
            - btnSinProximo:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =If(gPosCoord >= CountRows(colOrdem), RGBA(17, 59, 102, 1), RGBA(0, 120, 212, 1))
                  Font: =Font.'Segoe UI'
                  Height: =If(App.Width < 600, 40, 36)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: |-
                    =Set(gRP, Patch(TxRoundPaciente, Coalesce(LookUp(TxRoundPaciente, RoundRef.Id = gRound.ID && PacienteRef.Id = gPaciente.ID), Defaults(TxRoundPaciente)), {Title: gPaciente.Title & " · " & Text(Today(), "dd/mm"), RoundRef: {Id: gRound.ID, Value: gRound.Title}, PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title}, 'Desvio sugerido': gDesvioSugerido, 'Em desvio': tglSinEmDesvio.Value, 'Causa do desvio': ddSinCausa.Selected, 'Meta até o próximo round': txtSinMeta.Text, 'Previsão de alta revisada': dtpSinPrevisao.SelectedDate, 'Hospital dia': tglSinHospitalDia.Value, 'Cuidados com feridas pós-alta': tglSinFeridas.Value, 'Texto para o prontuário': txtSinPEP.Text}));
                    If(!IsBlank(gPlano.ID) && (dtpSinPrevisao.SelectedDate <> gPlano.DataAlvoAltaAtual || ddSinDestino.Selected.Value <> gPlano.DestinoPosAlta.Value), Set(gPlano, Patch(TxPlano, gPlano, {DataAlvoAltaAtual: dtpSinPrevisao.SelectedDate, DestinoPosAlta: ddSinDestino.Selected, VersaoPlano: Coalesce(gPlano.VersaoPlano, 1) + 1, DataUltimaRevisao: Now()}));
                    Patch(TxPlanoVersao, Defaults(TxPlanoVersao), {Title: gPaciente.Title & " · v" & gPlano.VersaoPlano, PlanoRef: {Id: gPlano.ID, Value: gPlano.Title}, PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title}, RoundRef: {Id: gRound.ID, Value: gRound.Title}, Versao: gPlano.VersaoPlano, DataAlvoAlta: gPlano.DataAlvoAltaAtual, DestinoPosAlta: LookUp(Choices(TxPlanoVersao.DestinoPosAlta), Value = gPlano.DestinoPosAlta.Value), MotivoInternacao: gPlano.MotivoInternacao, DesfechoPretendido: gPlano.DesfechoPretendido, QuemRevisou: gMeuMembro, DataRevisao: Now()}));
                    If(gPosCoord < CountRows(colOrdem), Set(gPosCoord, gPosCoord + 1);
                    Set(gPaciente, Index(colOrdem, gPosCoord));
                    Set(gPlano, LookUp(TxPlano, PacienteRef.Id = gPaciente.ID));
                    Set(gRP, LookUp(TxRoundPaciente, RoundRef.Id = gRound.ID && PacienteRef.Id = gPaciente.ID));
                    Set(gDesvioSugerido, Or(gPlano.DataAlvoAltaAtual < Today(), gPlano.DataAlvoAltaOriginal < Today()));
                    Set(gAbaSintese, "Decisões");
                    Set(gResetPend, true);
                    Set(gResetPend, false);
                    Set(gResetSint, true);
                    Set(gResetSint, false);
                    Set(gResetCrit, true);
                    Set(gResetCrit, false);
                    Notify("Síntese gravada. Próximo paciente: " & gPaciente.Title, NotificationType.Success), Notify("Síntese gravada. Último paciente concluído.", NotificationType.Success);
                    Set(gResetEnc, true);
                    Set(gResetEnc, false);
                    Set(gMostrarEnc, true);
                    Navigate(scrPainel))
                  Size: =If(App.Width < 600, 12, 11)
                  Text: =If(gPosCoord >= CountRows(colOrdem), "Gravar e encerrar o round ›", "Gravar e próximo ›")
                  Tooltip: ="Grava a síntese deste paciente e avança"
                  Visible: =gModoCoord && CountRows(colOrdem) > 0 && !locSug
                  Width: =If(App.Width < 600, Parent.Width - 166, 208)
                  X: =If(App.Width < 600, 142, Parent.Width - 208 - 24)
                  Y: =If(App.Width < 600, 60, 16)
            - lblSinTitulo:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =App.Width < 600
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(22, 32, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =34
                  PaddingLeft: =0
                  Size: =If(App.Width < 600, 18, 20)
                  Text: ="Síntese · " & gPaciente.Title
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =If(App.Width < 600, If(btnSinProximo.Visible, 108, 60), 54)
            - lblSinPlano:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =App.Width < 600
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 94, 92, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =If(App.Width < 600, 12, 11)
                  Text: ="Alvo original " & Coalesce(Text(gPlano.DataAlvoAltaOriginal, "dd/mm"), "—") & "  ·  alvo atual " & Coalesce(Text(gPlano.DataAlvoAltaAtual, "dd/mm"), "—") & "  ·  versão " & Coalesce(Text(gPlano.VersaoPlano), "—")
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =If(App.Width < 600, lblSinTitulo.Y + lblSinTitulo.Height + 4, 90)
            - recSinDesvio:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =If(gDesvioSugerido, RGBA(254, 243, 232, 1), RGBA(240, 247, 243, 1))
                  Height: =If(App.Width < 600, lblSinDesvioRazao.Y + lblSinDesvioRazao.Height + 10 - Self.Y, 72)
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =If(App.Width < 600, lblSinPlano.Y + lblSinPlano.Height + 10, 122)
            - lblSinDesvioTit:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(gDesvioSugerido, RGBA(154, 82, 18, 1), RGBA(21, 128, 61, 1))
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  PaddingLeft: =0
                  Text: =If(gDesvioSugerido, "Desvio de rota sugerido", "Dentro do plano")
                  Width: =Parent.Width - 80
                  X: =40
                  Y: =If(App.Width < 600, recSinDesvio.Y + 10, 132)
            - lblSinDesvioRazao:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =App.Width < 600
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(74, 91, 109, 1)
                  Font: =Font.'Segoe UI'
                  Height: =36
                  PaddingLeft: =0
                  Size: =If(App.Width < 600, 12, 11)
                  Text: |-
                    =With({o: gPlano.DataAlvoAltaOriginal, a: gPlano.DataAlvoAltaAtual, h: Today()},
                        With({dO: DateDiff(o, h, TimeUnit.Days), dA: DateDiff(a, h, TimeUnit.Days)},
                            If(IsBlank(gPlano.ID), "Paciente sem plano registrado.",
                               o < h && a < h, "Alvo original vencido há " & dO & If(dO = 1, " dia", " dias") & " (" & Text(o, "dd/mm") & "); alvo atual vencido há " & dA & If(dA = 1, " dia", " dias") & " (" & Text(a, "dd/mm") & ").",
                               o < h, "Alvo original vencido há " & dO & If(dO = 1, " dia", " dias") & " (" & Text(o, "dd/mm") & "), remarcado para " & Text(a, "dd/mm") & ".",
                               a < h, "Alvo atual vencido há " & dA & If(dA = 1, " dia", " dias") & " (" & Text(a, "dd/mm") & ").",
                               "Nenhuma data-alvo vencida.")))
                  Width: =Parent.Width - 80
                  X: =40
                  Y: =If(App.Width < 600, recSinDesvio.Y + 36, 158)
            - galSinAbas:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Height: =If(App.Width < 600, 48, 44)
                  Items: =["Decisões", "Categorias", "Pendências", "Critérios"]
                  ShowScrollbar: =false
                  TemplateSize: =(Parent.Width - 48) / 4
                  Width: =Parent.Width - 48
                  X: =24
                  Y: =If(App.Width < 600, recSinDesvio.Y + recSinDesvio.Height + 12, 206)
                Children:
                  - lblSinAba:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(gAbaSintese = ThisItem.Value, RGBA(255, 255, 255, 1), RGBA(74, 91, 109, 1))
                        Fill: =If(gAbaSintese = ThisItem.Value, RGBA(15, 109, 120, 1), RGBA(240, 243, 246, 1))
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Set(gAbaSintese, ThisItem.Value)
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =If(App.Width < 600, 12, 10)
                        Text: =ThisItem.Value
                        Width: =Parent.TemplateWidth - 4
                        X: =2
                        Y: =2
      - galSinCategorias:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(230, 234, 238, 1)
            Height: =Parent.Height - Self.Y - 20
            Items: =gCategorias
            TemplateSize: =92
            Visible: =gAbaSintese = "Categorias"
            Width: =Parent.Width - 48
            X: =24
            Y: =ctnSinCab.Height + 10
          Children:
            - lblSinCatNome:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(22, 32, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingLeft: =0
                  Size: =12
                  Text: =ThisItem.Value
                  Width: =Parent.TemplateWidth - 168
                  X: =4
                  Y: =6
            - lblSinCatEstado:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 94, 92, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingRight: =4
                  Size: =10
                  Text: |-
                    =With({a: LookUp(TxAnotacao, RoundId = gRound.ID && PacienteId = gPaciente.ID && Categoria.Value = ThisItem.Value)}, If(IsBlank(a.ID), "não preencheu", a.'Sem alteração desde o round anterior' = true, "sem alteração · " & Text(a.'Data e hora', DateTimeFormat.ShortTime), "preenchido às " & Text(a.'Data e hora', DateTimeFormat.ShortTime)))
                  Width: =160
                  X: =Parent.TemplateWidth - 164
                  Y: =6
            - lblSinCatObs:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(74, 91, 109, 1)
                  Font: =Font.'Segoe UI'
                  Height: =54
                  PaddingLeft: =0
                  Size: =11
                  Text: |-
                    =With({a: LookUp(TxAnotacao, RoundId = gRound.ID && PacienteId = gPaciente.ID && Categoria.Value = ThisItem.Value)}, Coalesce(a.'Observação da categoria', "-"))
                  Width: =Parent.TemplateWidth - 8
                  X: =4
                  Y: =30
      - btnSugSin:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderThickness: =1
            Color: =RGBA(0, 120, 212, 1)
            Fill: =RGBA(255, 255, 255, 0.95)
            Font: =Font.'Segoe UI'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 120, 212, 1)
            OnSelect: |-
              =Reset(txtSugSin);
              UpdateContext({locSug: true, locSugGrav: false})
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Size: =11
            Text: ="Sugestão"
            Tooltip: ="Deixe uma sugestão sobre esta tela"
            Visible: =!locSug
            Width: =120
            X: =Parent.Width - 136
            Y: =Parent.Height - 56
      - ctnSugSin:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =locSug
            Width: =Parent.Width
          Children:
            - recSugFundoSin:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0.55)
                  FocusedBorderThickness: =0
                  Height: =Parent.Height
                  Width: =Parent.Width
            - recSugCartaoSin:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderThickness: =0
                  Height: =380
                  Width: =Min(640, Parent.Width - 48)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Max(24, (Parent.Height - Self.Height) / 2)
            - lblSugTituloSin:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(32, 54, 71, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  PaddingLeft: =0
                  Size: =16
                  Text: ="Sugestão de melhoria"
                  Width: =recSugCartaoSin.Width - 48
                  X: =recSugCartaoSin.X + 24
                  Y: =recSugCartaoSin.Y + 20
            - lblSugInfoSin:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 110, 122, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  PaddingLeft: =0
                  Size: =11
                  Text: |-
                    ="Tela: " & App.ActiveScreen.Name & " · " & gAbaSintese & Char(10) & "Não inclua nome nem prontuário de paciente."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =recSugCartaoSin.Width - 48
                  X: =recSugCartaoSin.X + 24
                  Y: =recSugCartaoSin.Y + 56
            - txtSugSin:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(200, 208, 216, 1)
                  Default: =""
                  Font: =Font.'Segoe UI'
                  Height: =170
                  HintText: ="O que melhoraria nesta tela?"
                  MaxLength: =1500
                  Mode: =TextMode.MultiLine
                  Size: =12
                  Width: =recSugCartaoSin.Width - 48
                  X: =recSugCartaoSin.X + 24
                  Y: =recSugCartaoSin.Y + 108
            - btnSugCancelarSin:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(200, 210, 218, 1)
                  Color: =RGBA(96, 110, 122, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =RGBA(32, 54, 71, 1)
                  HoverFill: =RGBA(242, 242, 241, 1)
                  OnSelect: |-
                    =Reset(txtSugSin);
                    UpdateContext({locSug: false, locSugGrav: false})
                  Size: =11
                  Text: ="Cancelar"
                  Width: =(recSugCartaoSin.Width - 56) / 2
                  X: =recSugCartaoSin.X + 24
                  Y: =recSugCartaoSin.Y + recSugCartaoSin.Height - 68
            - btnSugEnviarSin:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(locSugGrav, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: |-
                    =If(
                        IsBlank(Trim(txtSugSin.Text)),
                        Notify("Escreva a sugestão antes de enviar.", NotificationType.Warning),
                        UpdateContext({locSugGrav: true});
                        IfError(
                            Patch(
                                TxSugestao,
                                Defaults(TxSugestao),
                                {
                                    Title: Left(Trim(txtSugSin.Text), 80),
                                    App: {Value: "Round Transplante"},
                                    Tela: App.ActiveScreen.Name & " · " & gAbaSintese,
                                    Sugestao: Trim(txtSugSin.Text),
                                    Categoria: Coalesce(gMinhaCategoria, "Não cadastrado"),
                                    Status: {Value: "Nova"}
                                }
                            ),
                            UpdateContext({locSugGrav: false});
                            Notify("Não foi possível registrar a sugestão. Tente de novo.", NotificationType.Error),
                            Reset(txtSugSin);
                            UpdateContext({locSug: false, locSugGrav: false});
                            Notify("Sugestão registrada. Obrigado!", NotificationType.Success)
                        )
                    )
                  Size: =11
                  Text: =If(locSugGrav, "Enviando...", "Enviar")
                  Width: =(recSugCartaoSin.Width - 56) / 2
                  X: =recSugCartaoSin.X + 32 + (recSugCartaoSin.Width - 56) / 2
                  Y: =recSugCartaoSin.Y + recSugCartaoSin.Height - 68
      - ctnSinDecisao:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - Self.Y - 20
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingRight: =12
            PaddingTop: =4
            Visible: =gAbaSintese = "Decisões"

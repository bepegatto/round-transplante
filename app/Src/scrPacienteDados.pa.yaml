                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  LayoutMinHeight: =36
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Data do transplante  ·  preencher quando ocorrer, se o paciente internou antes"
            - dtpPDTx:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  BorderColor: =RGBA(200, 208, 216, 1)
                  DefaultDate: =gPaciente.'Data do transplante'
                  DisplayMode: =If(gPDEdit, DisplayMode.Edit, DisplayMode.View)

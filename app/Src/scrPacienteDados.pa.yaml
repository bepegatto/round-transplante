            Height: =75
            Visible: =gPDEdit
            Width: =Parent.Width
            Y: =Parent.Height - 75
      - btnPDCancelar:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(200, 210, 218, 1)
            BorderThickness: =1
            Color: =RGBA(96, 110, 122, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =44

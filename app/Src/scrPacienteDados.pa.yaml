              =If(IsBlank(txtPDNome.Text) || IsBlank(txtPDLeito.Text) || IsBlank(dtpPDAdmissao.SelectedDate), Notify("Nome, leito e data de admissão não podem ficar vazios.", NotificationType.Warning), Set(gPaciente, Patch(TxPaciente, LookUp(TxPaciente, ID = gPaciente.ID), {Title: txtPDNome.Text, Prontuário: txtPDPront.Text, 'Data de nascimento': dtpPDNasc.SelectedDate, Leito: txtPDLeito.Text, 'Data de admissão': dtpPDAdmissao.SelectedDate, 'Data do transplante': dtpPDTx.SelectedDate, 'Tipo de doador': ddPDDoador.Selected, 'Peculiaridade imunológica ou infecciosa': txtPDPecul.Text})); If(!IsBlank(gPlano.ID), Set(gPlano, Patch(TxPlano, gPlano, {MotivoInternacao: txtPDMotivo.Text, DesfechoPretendido: txtPDDesfecho.Text}))); If(!IsBlank(gPlano.ID) && (dtpPDAlvo.SelectedDate <> gPlano.DataAlvoAltaAtual || ddPDDestino.Selected.Value <> gPlano.DestinoPosAlta.Value), Set(gPlano, Patch(TxPlano, gPlano, {DataAlvoAltaAtual: dtpPDAlvo.SelectedDate, DestinoPosAlta: ddPDDestino.Selected, VersaoPlano: Coalesce(gPlano.VersaoPlano, 1) + 1, DataUltimaRevisao: Now()})); Patch(TxPlanoVersao, Defaults(TxPlanoVersao), {Title: gPaciente.Title & " · v" & gPlano.VersaoPlano, PlanoRef: {Id: gPlano.ID, Value: gPlano.Title}, PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title}, Versao: gPlano.VersaoPlano, DataAlvoAlta: gPlano.DataAlvoAltaAtual, DestinoPosAlta: LookUp(Choices(TxPlanoVersao.DestinoPosAlta), Value = gPlano.DestinoPosAlta.Value), MotivoInternacao: gPlano.MotivoInternacao, DesfechoPretendido: gPlano.DesfechoPretendido, QuemRevisou: gMeuMembro, DataRevisao: Now()})); Set(gPDEdit, false); Set(gResetPD, true); Set(gResetPD, false); Notify("Dados atualizados.", NotificationType.Success))
            Size: =13
            Text: ="Salvar alterações"
            Visible: =gPDEdit
            Width: =(Parent.Width - 56) / 2
            X: =24 + (Parent.Width - 56) / 2 + 8
            Y: =Parent.Height - 60

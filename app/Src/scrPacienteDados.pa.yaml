                  Default: =gPlano.DesfechoPretendido
                  DisplayMode: =If(gPDEdit, DisplayMode.Edit, DisplayMode.View)
                  Font: =Font.'Segoe UI'
                  Height: =74
                  LayoutMinHeight: =74

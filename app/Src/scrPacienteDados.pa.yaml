                  Reset: =gResetPD
                  Size: =12
            - lblPDAlvoOriginal:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(74, 91, 109, 1)
                  Fill: =RGBA(247, 249, 250, 1)
                  Font: =Font.'Segoe UI'
                  Height: =64
                  LayoutMinHeight: =64
                  PaddingLeft: =8
                  Size: =11
                  Text: ="Data-alvo de alta ORIGINAL   ·   " & Coalesce(Text(gPlano.DataAlvoAltaOriginal, DateTimeFormat.ShortDate), "não registrada") & Char(10) & "Não se altera. É contra ela que o desvio é medido."
            - lblPDAlvoAtualCap:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)

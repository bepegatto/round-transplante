                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  LayoutMinHeight: =22
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Data de nascimento"
            - dtpPDNasc:
                Control: Classic/DatePicker@2.6.0

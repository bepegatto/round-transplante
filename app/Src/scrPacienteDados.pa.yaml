                  Default: =gPaciente.Title
                  DisplayMode: =If(gPDEdit, DisplayMode.Edit, DisplayMode.View)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  LayoutMinHeight: =44
                  Reset: =gResetPD
                  Size: =12
            - lblPDProntCap:

            - recPDSep1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(230, 234, 238, 1)
                  Height: =1
                  LayoutMinHeight: =1
            - lblPDSec2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(22, 32, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  LayoutMinHeight: =28
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Plano terapêutico"
            - lblPDMotivoCap:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  LayoutMinHeight: =22
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Motivo da internação"
            - txtPDMotivo:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(200, 208, 216, 1)
                  Default: =gPlano.MotivoInternacao
                  DisplayMode: =If(gPDEdit, DisplayMode.Edit, DisplayMode.View)
                  Font: =Font.'Segoe UI'
                  Height: =74
                  LayoutMinHeight: =74
                  Mode: =TextMode.MultiLine
                  Reset: =gResetPD
                  Size: =12
            - lblPDDesfechoCap:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  LayoutMinHeight: =22
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Desfecho pretendido"
            - txtPDDesfecho:

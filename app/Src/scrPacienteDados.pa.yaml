Screens:
  scrPacienteDados:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Set(gPlano, LookUp(TxPlano, PacienteRef.Id = gPaciente.ID)); Set(gPDEdit, gIrParaPlano = true); Set(gResetPD, true); Set(gResetPD, false); If(gIrParaPlano = true, SetFocus(txtPDMotivo)); Set(gIrParaPlano, false)
    Children:
      - ctnPDCab:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =lblPDModo.Y + lblPDModo.Height + 12
            Width: =Parent.Width
          Children:
            - lblPDVoltar:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =If(App.Width < 600, 40, 28)
                  OnSelect: =Navigate(scrPaciente)
                  PaddingLeft: =0
                  Text: ="< Voltar ao paciente"
                  Width: =If(App.Width < 600, 200, 240)
                  X: =24
                  Y: =If(App.Width < 600, 12, 20)
            - btnPDEditar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(15, 109, 120, 1)
                  BorderThickness: =1
                  Color: =RGBA(15, 109, 120, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =If(App.Width < 600, 40, 36)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(15, 109, 120, 1)
                  OnSelect: =Set(gPDEdit, true)
                  Size: =12
                  Text: ="Editar"
                  Visible: =!gPDEdit
                  Width: =If(App.Width < 600, 120, 148)
                  X: =If(App.Width < 600, Parent.Width - 144, Parent.Width - 172)
                  Y: =If(App.Width < 600, 12, 56)
            - lblPDTitulo:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =App.Width < 600
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(22, 32, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =34
                  PaddingLeft: =0
                  Size: =If(App.Width < 600, 18, 20)
                  Text: ="Dados de " & gPaciente.Title
                  Width: =If(App.Width < 600, Parent.Width - 48, Parent.Width - 200)
                  X: =24
                  Y: =If(App.Width < 600, 60, 54)
            - lblPDModo:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =App.Width < 600
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(gPDEdit, RGBA(154, 82, 18, 1), RGBA(96, 110, 122, 1))
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =If(App.Width < 600, 12, 11)
                  Text: =If(gPDEdit, "Modo de edição. Nada é gravado até você salvar.", "Somente leitura.")
                  Width: =If(App.Width < 600, Parent.Width - 48, Parent.Width - 200)
                  X: =24
                  Y: =If(App.Width < 600, lblPDTitulo.Y + lblPDTitulo.Height + 4, 90)
      - ctnPD:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - Self.Y - If(gPDEdit, 80, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingRight: =12
            PaddingTop: =4
            Width: =Parent.Width - 48
            X: =24
            Y: =ctnPDCab.Height
          Children:
            - lblPDSec1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(22, 32, 43, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  LayoutMinHeight: =28
                  PaddingLeft: =0
                  Size: =14
                  Text: ="Cadastro do paciente"
            - lblPDResumo:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(74, 91, 109, 1)
                  Fill: =RGBA(247, 249, 250, 1)
                  Font: =Font.'Segoe UI'
                  Height: =46
                  LayoutMinHeight: =46
                  PaddingLeft: =8
                  Size: =11
                  Text: |-
                    =With({n: gPaciente.'Data de nascimento', t: gPaciente.'Data do transplante', h: Today()},
                        If(IsBlank(n), "idade não informada", (DateDiff(n, h, TimeUnit.Years) - If(Month(h) * 100 + Day(h) < Month(n) * 100 + Day(n), 1, 0)) & " anos") &
                        "   ·   " & DateDiff(gPaciente.'Data de admissão', h, TimeUnit.Days) & " dias de internação" &
                        If(IsBlank(t), "   ·   sem transplante registrado",
                            With({d: DateDiff(t, h, TimeUnit.Days), m: DateDiff(t, h, TimeUnit.Months) - If(Day(h) < Day(t), 1, 0)},
                                "   ·   " &
                                If(m < 3, d & If(d = 1, " dia", " dias"),
                                   m < 12, m & " meses",
                                   With({a: RoundDown(m / 12, 0), r: Mod(m, 12)},
                                       a & If(a = 1, " ano", " anos") & If(r = 0, "", " e " & r & If(r = 1, " mês", " meses")))) &
                                " pós-transplante")) &
                        "   ·   " & gPaciente.Status.Value)
            - lblPDNomeCap:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(15, 109, 120, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  LayoutMinHeight: =22
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Nome completo"
            - txtPDNome:

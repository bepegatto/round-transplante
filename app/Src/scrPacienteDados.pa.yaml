                  Text: ="Versão atual do plano " & Coalesce(Text(gPlano.VersaoPlano), "—") & "   ·   última revisão " & Coalesce(Text(gPlano.DataUltimaRevisao, DateTimeFormat.ShortDate), "—") & Char(10) & "Alterar o alvo atual ou o destino aqui cria uma versão nova, igual à revisão feita na síntese do round."
      - recPDRodapeLinha:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(220, 226, 232, 1)

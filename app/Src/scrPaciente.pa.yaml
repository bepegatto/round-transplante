Screens:
  scrPaciente:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gCategoria, Coalesce(gMinhaCategoria, gCategoria, First(gCategorias).Value));
        Set(gAnotacaoAtual, LookUp(TxAnotacao, RoundId = gRound.ID && PacienteId = gPaciente.ID && Categoria.Value = gCategoria));
        Set(gSemAlt, !IsBlank(gAnotacaoAtual) && gAnotacaoAtual.'Sem alteração desde o round anterior' = true);
        ClearCollect(colDisp, Filter(TxDispositivo, PacienteId = gPaciente.ID));
        Set(gMostrarDisp, false);
        Set(gResetForm, true);
        Set(gResetForm, false)

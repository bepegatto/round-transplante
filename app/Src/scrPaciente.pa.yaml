                Control: Classic/DatePicker@2.6.0
                Properties:
                  BorderColor: =RGBA(200, 208, 216, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  Reset: =gResetDisp
                  Size: =12
                  Visible: =!IsBlank(gDispEdit) && IsBlank(gDispEdit.DataRetirada)
                  Width: =324
                  X: =recDispCartao.X + 24
                  Y: =recDispCartao.Y + 532
            - btnDispRetirar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: |-
                    =If(IsBlank(dtpDispRetirada.SelectedDate) ||
                        (!IsBlank(gDispEdit.DataInsercao) && dtpDispRetirada.SelectedDate < gDispEdit.DataInsercao),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(176, 96, 16, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverFill: =RGBA(150, 80, 12, 1)
                  OnSelect: |-
                    =Patch(TxDispositivo, LookUp(TxDispositivo, ID = gDispEdit.ID),
                        {DataRetirada: dtpDispRetirada.SelectedDate, UltimaRevisao: Now()});
                    ClearCollect(colDisp, Filter(TxDispositivo, PacienteId = gPaciente.ID));
                    Set(gMostrarDisp, false);
                    Notify("Retirada registrada. O dispositivo saiu da lista de em uso.", NotificationType.Success)
                  Size: =12
                  Text: ="Registrar retirada nesta data"
                  Visible: =!IsBlank(gDispEdit) && IsBlank(gDispEdit.DataRetirada)
                  Width: =324
                  X: =recDispCartao.X + 372
                  Y: =recDispCartao.Y + 532
            - lblDispRetiradoEm:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 110, 122, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  PaddingLeft: =0
                  Size: =12
                  Text: ="Retirado em " & Text(gDispEdit.DataRetirada, "dd/mm/yyyy")
                  Visible: =!IsBlank(gDispEdit) && !IsBlank(gDispEdit.DataRetirada)
                  Width: =324
                  X: =recDispCartao.X + 24
                  Y: =recDispCartao.Y + 532
            - btnDispDesfazer:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(176, 96, 16, 1)
                  BorderThickness: =1
                  Color: =RGBA(176, 96, 16, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(176, 96, 16, 1)
                  OnSelect: |-
                    =ClearCollect(colDisp, Filter(TxDispositivo, PacienteId = gPaciente.ID));
                    If(
                        !IsBlank(LookUp(colDisp,
                            ID <> gDispEdit.ID &&
                            IsBlank(DataRetirada) &&
                            Tipo.Value = gDispEdit.Tipo.Value &&
                            Lower(Trim(Coalesce(Local, ""))) = Lower(Trim(Coalesce(gDispEdit.Local, ""))))),
                        Notify("Já existe outro " & gDispEdit.Tipo.Value & " em uso no mesmo local. Corrija o local de um deles antes de desfazer.", NotificationType.Warning),
                        Patch(TxDispositivo, LookUp(TxDispositivo, ID = gDispEdit.ID),
                            {DataRetirada: Blank(), UltimaRevisao: Now()});
                        ClearCollect(colDisp, Filter(TxDispositivo, PacienteId = gPaciente.ID));
                        Set(gMostrarDisp, false);
                        Notify("Retirada desfeita. O dispositivo voltou para em uso.", NotificationType.Success)
                    )
                  Size: =12
                  Text: ="Desfazer retirada"
                  Visible: =!IsBlank(gDispEdit) && !IsBlank(gDispEdit.DataRetirada)
                  Width: =324
                  X: =recDispCartao.X + 372
                  Y: =recDispCartao.Y + 532
      - btnSugPac:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 120, 212, 1)
            BorderThickness: =1
            Color: =RGBA(0, 120, 212, 1)
            Fill: =RGBA(255, 255, 255, 0.95)
            Font: =Font.'Segoe UI'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 120, 212, 1)
            OnSelect: |-
              =Reset(txtSugPac);
              UpdateContext({locSug: true, locSugGrav: false})
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Size: =11
            Text: ="Sugestão"
            Tooltip: ="Deixe uma sugestão sobre esta tela"
            Visible: =!locSug && !gMostrarDisp && !gMostrarSaida
            Width: =120
            X: =Parent.Width - 136
            Y: =Parent.Height - 56
      - ctnSugPac:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =locSug
            Width: =Parent.Width
          Children:
            - recSugFundoPac:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0.55)
                  FocusedBorderThickness: =0
                  Height: =Parent.Height
                  Width: =Parent.Width
            - recSugCartaoPac:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(255, 255, 255, 1)
                  FocusedBorderThickness: =0
                  Height: =380
                  Width: =Min(640, Parent.Width - 48)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Max(24, (Parent.Height - Self.Height) / 2)
            - lblSugTituloPac:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(32, 54, 71, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  PaddingLeft: =0
                  Size: =16
                  Text: ="Sugestão de melhoria"
                  Width: =recSugCartaoPac.Width - 48
                  X: =recSugCartaoPac.X + 24
                  Y: =recSugCartaoPac.Y + 20
            - lblSugInfoPac:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(96, 110, 122, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  PaddingLeft: =0
                  Size: =11
                  Text: |-
                    ="Tela: " & App.ActiveScreen.Name & " · " & gCategoria & Char(10) & "Não inclua nome nem prontuário de paciente."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =recSugCartaoPac.Width - 48
                  X: =recSugCartaoPac.X + 24
                  Y: =recSugCartaoPac.Y + 56
            - txtSugPac:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(200, 208, 216, 1)
                  Default: =""
                  Font: =Font.'Segoe UI'
                  Height: =170
                  HintText: ="O que melhoraria nesta tela?"
                  MaxLength: =1500
                  Mode: =TextMode.MultiLine
                  Size: =12
                  Width: =recSugCartaoPac.Width - 48
                  X: =recSugCartaoPac.X + 24
                  Y: =recSugCartaoPac.Y + 108
            - btnSugCancelarPac:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(200, 210, 218, 1)
                  Color: =RGBA(96, 110, 122, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =RGBA(32, 54, 71, 1)
                  HoverFill: =RGBA(242, 242, 241, 1)
                  OnSelect: |-
                    =Reset(txtSugPac);
                    UpdateContext({locSug: false, locSugGrav: false})
                  Size: =11
                  Text: ="Cancelar"
                  Width: =(recSugCartaoPac.Width - 56) / 2
                  X: =recSugCartaoPac.X + 24
                  Y: =recSugCartaoPac.Y + recSugCartaoPac.Height - 68
            - btnSugEnviarPac:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(locSugGrav, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverFill: =RGBA(16, 110, 190, 1)
                  OnSelect: |-
                    =If(
                        IsBlank(Trim(txtSugPac.Text)),
                        Notify("Escreva a sugestão antes de enviar.", NotificationType.Warning),
                        UpdateContext({locSugGrav: true});
                        IfError(
                            Patch(
                                TxSugestao,
                                Defaults(TxSugestao),
                                {
                                    Title: Left(Trim(txtSugPac.Text), 80),
                                    App: {Value: "Round Transplante"},
                                    Tela: App.ActiveScreen.Name & " · " & gCategoria,
                                    Sugestao: Trim(txtSugPac.Text),
                                    Categoria: Coalesce(gMinhaCategoria, "Não cadastrado"),
                                    Status: {Value: "Nova"}
                                }
                            ),
                            UpdateContext({locSugGrav: false});
                            Notify("Não foi possível registrar a sugestão. Tente de novo.", NotificationType.Error),
                            Reset(txtSugPac);
                            UpdateContext({locSug: false, locSugGrav: false});
                            Notify("Sugestão registrada. Obrigado!", NotificationType.Success)
                        )
                    )
                  Size: =11
                  Text: =If(locSugGrav, "Enviando...", "Enviar")
                  Width: =(recSugCartaoPac.Width - 56) / 2
                  X: =recSugCartaoPac.X + 32 + (recSugCartaoPac.Width - 56) / 2
                  Y: =recSugCartaoPac.Y + recSugCartaoPac.Height - 68
      - lblSaidaTitulo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(32, 54, 71, 1)
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =16
            Text: ="Registrar saída/alta do paciente"
            Visible: =gMostrarSaida
            Width: =Parent.Width - 88
            X: =44
            Y: =164
      - lblSaidaStatusCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(32, 54, 71, 1)
            FontWeight: =FontWeight.Semibold
            Height: =38
            Size: =11
            Text: =If(gPaciente.Status.Value = "Internado", "Desfecho", "Saída/alta já registrada como " & gPaciente.Status.Value & " em " & Text(gPaciente.'Data de saída', DateTimeFormat.ShortDate))
            Visible: =gMostrarSaida
            Width: =Parent.Width - 88
            X: =44
            Y: =238
      - lblSaidaDataCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(32, 54, 71, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Size: =11
            Text: ="Data da saída/alta"
            Visible: =gMostrarSaida && gPaciente.Status.Value = "Internado"
            Width: =Parent.Width - 88
            X: =44
            Y: =334
      - dtpSaidaData:
          Control: Classic/DatePicker@2.6.0
          Properties:
            EndYear: =Year(Today())
            Height: =44
            Reset: =gResetForm
            StartYear: =Year(Today()) - 1
            Visible: =gMostrarSaida && gPaciente.Status.Value = "Internado"
            Width: =Parent.Width - 88
            X: =44
            Y: =358
      - btnSaidaConfirmar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(IsBlank(ddSaidaStatus.Selected), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(0, 95, 105, 1)
            Height: =44
            OnSelect: |-
              =ClearCollect(colPendPac, Filter(TxPendencia, PacienteRef.Id = gPaciente.ID && Status.Value = "Aberta"));
              Set(gPendCanc, CountRows(colPendPac));
              Set(gPaciente, Patch(TxPaciente, LookUp(TxPaciente, ID = gPaciente.ID), {Status: ddSaidaStatus.Selected, 'Data de saída': dtpSaidaData.SelectedDate}));
              ForAll(colPendPac, Patch(TxPendencia, ThisRecord, {Status: {Value: "Cancelada"}, 'Resolvida em': Now()}));
              Notify("Saída/alta registrada. " & gPendCanc & " pendência(s) cancelada(s).", NotificationType.Success);
              Set(gMostrarSaida, false)
            Size: =12
            Text: ="Confirmar saída/alta"
            Visible: =gMostrarSaida && gPaciente.Status.Value = "Internado"
            Width: =Parent.Width - 88
            X: =44
            Y: =466
      - btnPacAvancar:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =10
            OnSelect: |-
              =If(!gModoCoord && CountRows(colOrdem) > 0 && Index(colOrdem, gPosCoord).ID = gPaciente.ID && !IsBlank(gAnotacaoAtual) && DateDiff(gAnotacaoAtual.'Data e hora', Now(), TimeUnit.Seconds) < 30,
                  If(gPosCoord < CountRows(colOrdem),
                      Set(gPosCoord, gPosCoord + 1);
                      Set(gPaciente, Index(colOrdem, gPosCoord));
                      Set(gAnotacaoAtual, LookUp(TxAnotacao, RoundId = gRound.ID && PacienteId = gPaciente.ID && Categoria.Value = gCategoria));
                      Set(gSemAlt, !IsBlank(gAnotacaoAtual) && gAnotacaoAtual.'Sem alteração desde o round anterior' = true);
                      Set(gAnotacaoBase, If(!IsBlank(gAnotacaoAtual) && gAnotacaoAtual.'Sem alteração desde o round anterior' <> true, gAnotacaoAtual, First(Sort(Filter(TxAnotacao, PacienteId = gPaciente.ID && Categoria.Value = gCategoria && 'Sem alteração desde o round anterior' = false), 'Data e hora', SortOrder.Descending))));
                      ClearCollect(colDisp, Filter(TxDispositivo, PacienteId = gPaciente.ID));
                      Set(gMostrarDisp, false);
                      Set(gResetForm, true);
                      Set(gResetForm, false);
                      Notify("Próximo paciente: " & gPaciente.Title, NotificationType.Information),
                      Notify("Você percorreu todos os pacientes.", NotificationType.Success);
                      Navigate(scrPainel)
                  )
              )
            Text: ="Avançar"
            Visible: =false
            Width: =10

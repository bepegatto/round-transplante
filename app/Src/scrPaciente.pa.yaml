                  Visible: =gTOFaltas.p = gPaciente.ID && !IsBlank(gTOFaltas.m)
            - btnGravarTerapiaOcupacional:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =If(!IsBlank(gAnotacaoAtual) && !gSemAlt, RGBA(21, 128, 61, 1), RGBA(255, 255, 255, 1))
                  Fill: =If(!IsBlank(gAnotacaoAtual) && !gSemAlt, RGBA(220, 252, 231, 1), RGBA(15, 109, 120, 1))
                  Font: =Font.'Segoe UI'
                  Height: =48
                  HoverFill: =If(!IsBlank(gAnotacaoAtual) && !gSemAlt, RGBA(200, 240, 214, 1), RGBA(12, 90, 100, 1))
                  LayoutMinHeight: =48
                  OnSelect: |-
                    =With({f: Concat(Filter(Table(
                            {c: IsBlank(ddTOAvd.Selected.Value), t: "AVD"},
                            {c: IsBlank(ddTOAlteracaoCognitiva.Selected.Value), t: "alteração de componente cognitivo"},
                            {c: ddTOAlteracaoCognitiva.Selected.Value = "Sim" && IsBlank(Trim(txtTOCognitivoDetalhe.Text)), t: "qual alteração cognitiva"},
                            {c: CountRows(Filter(cmbTOOrientacoes.SelectedItems, !IsBlank(Value))) = 0, t: "orientações"},
                            {c: "Outros" in cmbTOOrientacoes.SelectedItems.Value && IsBlank(Trim(txtTOOrientacoesOutros.Text)), t: "quais outras orientações"},
                            {c: "Não se aplica" in cmbTOOrientacoes.SelectedItems.Value && CountRows(Filter(cmbTOOrientacoes.SelectedItems, !IsBlank(Value))) > 1, t: "orientações (Não se aplica junto com outra opção)"},
                            {c: IsBlank(ddTOReabilitacaoAlta.Selected.Value), t: "reabilitação na alta"},
                            {c: IsBlank(ddTODispositivoMarcha.Selected.Value), t: "dispositivo auxiliar de marcha"},
                            {c: ddTODispositivoMarcha.Selected.Value = "Outros" && IsBlank(Trim(txtTODispositivoMarchaOutro.Text)), t: "qual dispositivo de marcha"},
                            {c: CountRows(Filter(cmbTODispositivoAlta.SelectedItems, !IsBlank(Value))) = 0, t: "prescrição de dispositivo na alta"},
                            {c: "Outros" in cmbTODispositivoAlta.SelectedItems.Value && IsBlank(Trim(txtTOPrescricaoOutros.Text)), t: "quais outras prescrições"},
                            {c: "Não se aplica" in cmbTODispositivoAlta.SelectedItems.Value && CountRows(Filter(cmbTODispositivoAlta.SelectedItems, !IsBlank(Value))) > 1, t: "prescrição (Não se aplica junto com outra opção)"}
                        ), c), t, "; ")},
                        If(!IsBlank(f),
                            Set(gTOFaltas, {p: gPaciente.ID, m: "Não gravado. Falta preencher: " & f & "."}),
                            Set(gTOFaltas, {p: gPaciente.ID, m: ""});
                            Set(gAnotacaoAtual, Patch(TxAnotacao,
                                Coalesce(LookUp(TxAnotacao, RoundId = gRound.ID && PacienteId = gPaciente.ID && Categoria.Value = gCategoria), Defaults(TxAnotacao)),
                                {Title: gPaciente.Title & " · " & gCategoria,
                                 RoundRef: {Id: gRound.ID, Value: gRound.Title},
                                 PacienteRef: {Id: gPaciente.ID, Value: gPaciente.Title},
                                 RoundId: gRound.ID, PacienteId: gPaciente.ID,
                                 Categoria: {Value: gCategoria},
                                 'Sem alteração desde o round anterior': false,
                                 'Data e hora': Now(),
                                 'Autor é da categoria': (gCategoria = gMinhaCategoria),
                                 'TO - AVD': ddTOAvd.Selected,
                                 'TO - alteração de componente cognitivo': ddTOAlteracaoCognitiva.Selected,
                                 'TO - qual alteração cognitiva': If(ddTOAlteracaoCognitiva.Selected.Value = "Sim", txtTOCognitivoDetalhe.Text, ""),
                                 'TO - orientações': Filter(cmbTOOrientacoes.SelectedItems, !IsBlank(Value)),
                                 'TO - reabilitação na alta': ddTOReabilitacaoAlta.Selected,
                                 'TO - dispositivo auxiliar de marcha': ddTODispositivoMarcha.Selected,
                                 'TO - prescrição de dispositivo na alta': Filter(cmbTODispositivoAlta.SelectedItems, !IsBlank(Value)),
                                 TOOrientacoesOutros: If("Outros" in cmbTOOrientacoes.SelectedItems.Value, txtTOOrientacoesOutros.Text, ""),
                                 TODispositivoMarchaOutro: If(ddTODispositivoMarcha.Selected.Value = "Outros", txtTODispositivoMarchaOutro.Text, ""),
                                 TOPrescricaoOutros: If("Outros" in cmbTODispositivoAlta.SelectedItems.Value, txtTOPrescricaoOutros.Text, ""),
                                 'Observação da categoria': txtObsTerapiaOcupacional.Text}));
                            Set(gSemAlt, false);
                            Notify("Bloco de " & gCategoria & " gravado.", NotificationType.Success);
                            If(!IsBlank(gMeuMembro) && !IsBlank(gAnotacaoAtual), Set(gAnotacaoAtual, Patch(TxAnotacao, gAnotacaoAtual, {AutorRegistro: gMeuMembro})))
                        )
                    ); Select(btnPacAvancar)
                  Size: =14
                  Text: =If(!IsBlank(gAnotacaoAtual) && !gSemAlt, "Bloco gravado" & If(IsBlank(gAnotacaoAtual.'Data e hora'), "", " às " & Text(gAnotacaoAtual.'Data e hora', DateTimeFormat.ShortTime)) & " · atualizar", "Gravar bloco de Terapia Ocupacional")
